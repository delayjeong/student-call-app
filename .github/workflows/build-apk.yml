name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 저장소 Settings → Secrets and variables → Actions 에 아래 4개를 등록하면
      # 항상 같은 키로 서명된 release APK가 만들어져, 전자칠판에서 지우지 않고 업데이트할 수 있습니다.
      #   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
      - name: Build signed release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          gradle -p android :app:assembleRelease
          mkdir -p dist && cp android/app/build/outputs/apk/release/app-release.apk "dist/StudentCallReceiver-${GITHUB_RUN_NUMBER}.apk"

      - name: Build debug APK (서명 키 미등록)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        run: |
          echo "::warning::서명 키가 등록되지 않아 debug APK를 만듭니다. 빌드마다 서명이 달라 업데이트 설치 시 기존 앱을 지워야 합니다. README의 '서명 키 등록'을 참고하세요."
          gradle -p android :app:assembleDebug
          mkdir -p dist && cp android/app/build/outputs/apk/debug/app-debug.apk "dist/StudentCallReceiver-${GITHUB_RUN_NUMBER}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StudentCallReceiver-${{ github.run_number }}
          path: dist/*.apk
