name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    # ubuntu-24.04 이미지에는 Android SDK가 미리 설치되어 있다 ($ANDROID_HOME)
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 저장소 Settings → Secrets and variables → Actions 에 아래 4개를 등록하면
      # 항상 같은 키로 서명된 release APK가 만들어져, 전자칠판에서 지우지 않고 업데이트할 수 있습니다.
      #   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
      - name: Build signed release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          gradle -p android :app:assembleRelease
          mkdir -p dist && cp android/app/build/outputs/apk/release/app-release.apk "dist/StudentCallReceiver-${GITHUB_RUN_NUMBER}.apk"

      - name: Build debug APK (서명 키 미등록)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        run: |
          echo "::warning::서명 키가 등록되지 않아 debug APK를 만듭니다. 빌드마다 서명이 달라 업데이트 설치 시 기존 앱을 지워야 합니다. README의 '서명 키 등록'을 참고하세요."
          gradle -p android :app:assembleDebug
          mkdir -p dist && cp android/app/build/outputs/apk/debug/app-debug.apk "dist/StudentCallReceiver-${GITHUB_RUN_NUMBER}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StudentCallReceiver-${{ github.run_number }}
          path: dist/*.apk

      # main에서 성공적으로 빌드된 APK는 Release Assets에도 올린다.
      # 사용자는 Releases 페이지에서 ZIP을 풀지 않고 .apk를 바로 다운로드할 수 있다.
      - name: Publish APK to GitHub Release
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Student Call build ${{ github.run_number }}
          body: |
            Student Call Receiver 자동 빌드
            Commit: ${{ github.sha }}

            서명 키가 등록된 경우 release APK, 미등록인 경우 debug APK입니다.
          files: dist/*.apk
          fail_on_unmatched_files: true
          make_latest: true
