name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    # ubuntu-24.04 이미지에는 Android SDK가 미리 설치되어 있다 ($ANDROID_HOME)
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle -p android :app:testDebugUnitTest

      # 저장소 Settings → Secrets and variables → Actions 에 아래 4개를 등록하면
      # 항상 같은 키로 서명된 release APK가 만들어져, 전자칠판에서 지우지 않고 업데이트할 수 있습니다.
      #   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
      - name: Build signed release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # 붙여넣을 때 섞인 공백·줄바꿈은 무시
          if ! printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::SIGNING_KEYSTORE_BASE64 값을 해석할 수 없습니다. README의 '서명 키 등록' 2단계 명령으로 다시 복사해 주세요."; exit 1
          fi
          # 붙여넣을 때 섞인 앞뒤 공백·줄바꿈은 무시
          trimmed=$(printf '%s' "$SIGNING_STORE_PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ "$trimmed" != "$SIGNING_STORE_PASSWORD" ]; then
            echo "::warning::SIGNING_STORE_PASSWORD 앞뒤의 공백·줄바꿈을 제거하고 사용합니다."
            export SIGNING_STORE_PASSWORD="$trimmed"
          fi
          kp=$(printf '%s' "$SIGNING_KEY_PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'); export SIGNING_KEY_PASSWORD="$kp"
          # 원인을 구분해서 알려 준다 (비밀번호 값은 출력하지 않음)
          size=$(stat -c %s "$RUNNER_TEMP/release.jks")
          if ! out=$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$SIGNING_STORE_PASSWORD" 2>&1); then
            if echo "$out" | grep -qi "password"; then
              # 값은 숨기고 특징만 알려 준다: 글자 수, 영문·숫자 외 문자(한글 등) 포함 여부
              chars=$(printf '%s' "$SIGNING_STORE_PASSWORD" | LC_ALL=C.UTF-8 wc -m)
              if printf '%s' "$SIGNING_STORE_PASSWORD" | LC_ALL=C grep -q '[^ -~]'; then kind="한글 등 영문·숫자·기호가 아닌 문자가 들어 있음"; else kind="영문·숫자·기호만 있음"; fi
              echo "::error::키 파일(${size}바이트)은 정상이지만 SIGNING_STORE_PASSWORD 비밀번호가 맞지 않습니다. 등록된 값: ${chars}글자, ${kind}. PC에서 정한 비밀번호의 글자 수와 비교해 주세요."
            else
              echo "::error::SIGNING_KEYSTORE_BASE64를 복원한 파일(${size}바이트)이 키 파일이 아닙니다. PC의 release.jks 크기와 비교하고, README 2단계 명령으로 다시 복사해 주세요."
            fi
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" > /dev/null 2>&1; then
            aliases=$(echo "$out" | grep -i 'PrivateKeyEntry' | cut -d, -f1 | tr '\n' ' ')
            echo "::error::비밀번호는 맞지만 SIGNING_KEY_ALIAS 값이 키 이름과 다릅니다. 키 파일 안의 이름: ${aliases}"; exit 1
          fi
          export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          set -o pipefail
          if ! gradle -p android :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # 실패 원인을 실행 요약(Annotations)에 바로 보이도록
            msg=$(sed -n '/What went wrong/,/Try:/p' "$RUNNER_TEMP/gradle.log" | grep -v -e 'What went wrong' -e 'Try:' -e '^\s*$' | head -8 | tr '\n' ' ')
            echo "::error::Gradle 실패: ${msg:-로그를 확인해 주세요}"; exit 1
          fi
          mkdir -p dist && cp android/app/build/outputs/apk/release/app-release.apk "dist/StudentCallReceiver-${GITHUB_RUN_NUMBER}.apk"

      - name: Build debug APK (서명 키 미등록)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        run: |
          echo "::warning::서명 키가 등록되지 않아 debug APK를 만듭니다. 빌드마다 서명이 달라 업데이트 설치 시 기존 앱을 지워야 합니다. README의 '서명 키 등록'을 참고하세요."
          gradle -p android :app:assembleDebug
          mkdir -p dist && cp android/app/build/outputs/apk/debug/app-debug.apk "dist/StudentCallReceiver-${GITHUB_RUN_NUMBER}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StudentCallReceiver-${{ github.run_number }}
          path: dist/*.apk

      # main에서 성공적으로 빌드된 APK는 Release Assets에도 올린다.
      # 사용자는 Releases 페이지에서 ZIP을 풀지 않고 .apk를 바로 다운로드할 수 있다.
      - name: Publish APK to GitHub Release
        # 서명 키로 만든 release APK만 올린다 (debug APK는 업데이트 설치가 안 되므로 배포하지 않음)
        if: ${{ github.ref == 'refs/heads/main' && env.HAS_KEYSTORE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Student Call build ${{ github.run_number }}
          body: |
            학생 호출 수신기 (전자칠판용, Google Apps Script 방식)
            Commit: ${{ github.sha }}

            설치 후 앱에 Apps Script 웹앱 주소(https://script.google.com/macros/s/…/exec)와 수신기 키를 입력하세요.
            이전 버전을 덮어 설치하면 예전 PC 서버 주소는 자동으로 지워집니다. 설치 안내: SETUP.md
          files: dist/*.apk
          fail_on_unmatched_files: true
          make_latest: true
